<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <section class="container">
        <div class="imc-container">
            <div>
                <p class="title-imc">IMC</p>
                <p>Menos do que 18,5</p>
                <p>Entre 18,5 e 24,9</p>
                <p>Entre 25 e 29,9</p>
                <p>Entre 30 e 34,9</p>
                <p>Entre 35 e 39,9</p>
                <p>Mais do que 40</p>
            </div>

            <div>
                <p class="title-imc">Resultado</p>
                <p>Abaixo do Peso</p>
                <p>Peso normal</p>
                <p>Sobrepeso</p>
                <p>Obesidade grau 1</p>
                <p>Obesidade grau 2</p>
                <p>Obesidade grau 3</p>
            </div>
        </div>
        <form class="form">
            <h1>Calcule o seu IMC</h1>
            <label for="input-teste1">Peso:</label>
            <input type="text" class="peso" placeholder="Ex: 67">

            <label for="input-teste1">Altura:</label>
            <input type="text" class="altura" placeholder="Ex: 1.74">

            <button>Calcular</button>
            <div class="resultado"></div>
        </form>
    </section>
    <script src="./index.js"></script>
</body>

</html>
